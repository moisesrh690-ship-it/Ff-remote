<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FF Remote — Demo visual</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif;padding:18px}
.panel{max-width:480px;margin:20px auto;border:1px solid #ff2020;border-radius:18px;padding:22px;background:linear-gradient(145deg,#171010,#050505);box-shadow:0 0 22px #b00000}
h1{text-align:center;color:#ff2525;font-size:32px;margin:4px 0}p.sub{text-align:center;color:#aaa;margin:0 0 22px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid #3a1a1a}
.name{font-weight:bold;font-size:18px}.note{font-size:12px;color:#999;margin-top:5px}
.switch{position:relative;width:58px;height:32px;flex-shrink:0}.switch input{display:none}.track{position:absolute;inset:0;background:#444;border-radius:30px;cursor:pointer;transition:.2s}.track:before{content:"";position:absolute;width:24px;height:24px;left:4px;top:4px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked+.track{background:#ed1717}.switch input:checked+.track:before{transform:translateX(26px)}
.fov{padding:20px 0}.fovhead{display:flex;justify-content:space-between;align-items:center}.value{background:#1b0808;border:1px solid #ff2525;padding:8px 14px;border-radius:8px;font-size:22px;min-width:65px;text-align:center;color:#ff3333}
input[type=range]{width:100%;accent-color:#ff2020;margin:20px 0 8px}.range-labels{display:flex;justify-content:space-between;color:#aaa;font-size:12px}
button{width:100%;margin-top:20px;padding:15px;border:0;border-radius:10px;background:#e71919;color:#fff;font-weight:bold;font-size:18px;cursor:pointer}button:active{transform:scale(.99)}
.status{text-align:center;color:#aaa;font-size:12px;margin-top:14px}.warning{text-align:center;color:#ff5555;font-size:11px;margin-top:18px}
</style>
</head>
<body>
<div class="panel">
<h1>FF REMOTE</h1><p class="sub">PAINEL DEMONSTRATIVO • RED EDITION</p>
<div class="row"><div><div class="name">AIMBOT</div><div class="note">Controle visual de demonstração</div></div><label class="switch"><input id="aim" type="checkbox"><span class="track"></span></label></div>
<div class="fov">
<div class="fovhead"><div><div class="name">AIM FOV</div><div class="note">Ajuste demonstrativo de 0 a 100</div></div><div class="value" id="val">50</div></div>
<input id="slider" type="range" min="0" max="100" value="50" step="1">
<div class="range-labels"><span>0</span><span>100</span></div>
</div>
<div class="row"><div><div class="name">ESP</div><div class="note">Alternância visual de demonstração</div></div><label class="switch"><input id="esp" type="checkbox"><span class="track"></span></label></div>
<button id="activate">ATIVAR DEMO</button><div class="status" id="status">Status: demonstração desligada</div>
<div class="warning">DEMO VISUAL — NÃO SE CONECTA AO FREE FIRE</div>
</div>
<script>
const slider=document.getElementById('slider'),val=document.getElementById('val');
slider.addEventListener('input',()=>val.textContent=slider.value);
document.getElementById('activate').addEventListener('click',()=>{
 const active=document.getElementById('aim').checked||document.getElementById('esp').checked;
 document.getElementById('status').textContent=active?'Status: opções visuais selecionadas':'Status: demonstração desligada';
});
</script>
</body></html>
